# Thresholds are starting points for a low-traffic storefront; tune after a few weeks of data.
# Keep annotations free of angle brackets and ampersands: Telegram renders them as HTML.
groups:
  - name: api
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: API is down
          description: Prometheus cannot scrape {{ $labels.instance }} for over 1 minute.

      - alert: HighErrorRate
        expr: job:http_errors:ratio5m{job="api"} > 0.05 and on (job) job:http_requests:rate5m > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: API 5xx error rate is {{ $value | humanizePercentage }}
          description: More than 5% of requests failed with a 5xx status over the last 5 minutes.

      - alert: HighErrorRate
        expr: job:http_errors:ratio5m{job="api"} > 0.01 and on (job) job:http_requests:rate5m > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API 5xx error rate is {{ $value | humanizePercentage }}
          description: More than 1% of requests failed with a 5xx status for 10 minutes.

      - alert: HighLatencyP95
        expr: job:http_latency:p95_5m{job="api"} > 1 and on (job) job:http_requests:rate5m > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: API P95 latency is {{ $value | humanizeDuration }}
          description: 95th percentile latency has been above 1s for 10 minutes.

      - alert: HighLatencyP99
        expr: job:http_latency:p99_5m{job="api"} > 2.5 and on (job) job:http_requests:rate5m > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API P99 latency is {{ $value | humanizeDuration }}
          description: 99th percentile latency has been above 2.5s for 10 minutes.

      - alert: TooManyInProgressRequests
        expr: sum by (job) (http_requests_in_progress{job="api"}) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} requests in progress"
          description: More than 50 concurrent requests for 5 minutes; workers may be saturated.

      - alert: ExceptionSpike
        expr: sum by (job) (increase(app_exceptions_total{job="api", handler=~"unhandled|database"}[5m])) > 10
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanize }} unhandled or database exceptions in 5 minutes"
          description: Check the API logs (filter by request id) for the failing requests.

      - alert: DbPoolSaturation
        expr: sum by (job) (db_pool_checked_out_connections{job="api"}) / sum by (job) (db_pool_max_connections{job="api"}) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: DB connection pool {{ $value | humanizePercentage }} used
          description: More than 80% of pooled connections are checked out; requests may time out waiting for a connection.

  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL is down
          description: postgres-exporter cannot connect to the database.

      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connections at {{ $value | humanizePercentage }} of max_connections
          description: The server is close to refusing new connections.

  - name: containers
    rules:
      - alert: ContainerHighCpu
        expr: |
          sum by (container_label_com_docker_compose_service) (
            rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_service=~"api|db|weaviate"}[5m])
          ) / scalar(count(node_cpu_seconds_total{mode="idle"})) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Container {{ $labels.container_label_com_docker_compose_service }} uses {{ $value | humanizePercentage }} of host CPU
          description: Sustained high CPU usage for 10 minutes.

      - alert: ContainerHighMemory
        expr: |
          sum by (container_label_com_docker_compose_service) (
            container_memory_working_set_bytes{container_label_com_docker_compose_service=~"api|db|weaviate"}
          ) / scalar(sum(node_memory_MemTotal_bytes)) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Container {{ $labels.container_label_com_docker_compose_service }} uses {{ $value | humanizePercentage }} of host memory
          description: Sustained high memory usage for 10 minutes; check for leaks.

      - alert: ContainerNearMemoryLimit
        expr: |
          (
            container_memory_working_set_bytes{container_label_com_docker_compose_service!=""}
              /
            container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""}
          ) > 0.9
          and container_spec_memory_limit_bytes{container_label_com_docker_compose_service!=""} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container {{ $labels.container_label_com_docker_compose_service }} at {{ $value | humanizePercentage }} of its memory limit
          description: The container may be OOM-killed soon.

  - name: host
    rules:
      - alert: HostHighCpu
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is {{ $value | humanizePercentage }}
          description: Host CPU has been above 90% for 10 minutes.

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Host available memory is {{ $value | humanizePercentage }}
          description: Less than 10% of host memory is available.

      - alert: HostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
            /
          node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"} < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Root disk has {{ $value | humanizePercentage }} free
          description: Less than 10% disk space left; Postgres and Prometheus will fail when it fills up.

  - name: targets
    rules:
      - alert: TargetDown
        expr: up{job!="api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Scrape target {{ $labels.job }} is down
          description: Prometheus cannot scrape {{ $labels.instance }} for over 2 minutes.
